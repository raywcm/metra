name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - run: make build
      - run: ./bin/metra --snapshot
      - run: make smoke
      - run: python3 scripts/smoke.py bin/metra --language zh-CN --terminal-background light
      - run: python3 scripts/smoke.py bin/metra --language zh-CN --theme light
      - run: python3 scripts/test_install.py
      - run: python3 scripts/notices.py --check
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=publish
      - run: python3 scripts/homebrew.py dist
      - run: python3 scripts/check_packages.py dist
      - name: Install and exercise Debian package
        run: |
          sudo dpkg -i dist/metra_*_linux_amd64.deb
          metra --snapshot
          sudo dpkg -r metra
      - uses: actions/upload-artifact@v4
        with:
          name: metra-packages
          path: dist/
